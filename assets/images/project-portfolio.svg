<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="pGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="url(#pGrad1)"/>
  
  <!-- Subtle decorative grid -->
  <g stroke="#38bdf8" stroke-width="0.5" opacity="0.12">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Browser Window Frame -->
  <g transform="translate(50, 40)">
    <!-- Main Window -->
    <rect width="500" height="280" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <!-- Titlebar -->
    <path d="M0 10 Q0 0 10 0 L490 0 Q500 0 500 10 L500 36 L0 36 Z" fill="#1e293b"/>
    <!-- Window controls -->
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    
    <!-- Search Bar -->
    <rect x="80" y="8" width="300" height="20" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="96" y="22" font-family="monospace" font-size="10" fill="#94a3b8">https://vijayaragavan.dev/portfolio</text>

    <!-- Hero Mockup Inside Window -->
    <rect x="25" y="55" width="260" height="18" rx="4" fill="url(#pAcc)" opacity="0.85"/>
    <rect x="25" y="82" width="180" height="10" rx="3" fill="#64748b"/>
    <rect x="25" y="100" width="220" height="8" rx="2" fill="#475569"/>
    <rect x="25" y="114" width="190" height="8" rx="2" fill="#475569"/>

    <rect x="25" y="136" width="90" height="26" rx="6" fill="#38bdf8"/>
    <text x="70" y="153" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">View Projects</text>

    <rect x="125" y="136" width="80" height="26" rx="6" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="165" y="153" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Contact</text>

    <!-- Side Graphic / Avatar Placeholder Card -->
    <rect x="330" y="55" width="140" height="145" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="400" cy="105" r="32" fill="#0284c7" opacity="0.4"/>
    <circle cx="400" cy="105" r="22" fill="#38bdf8"/>
    <path d="M365 180 C365 150 380 140 400 140 C420 140 435 150 435 180 Z" fill="#38bdf8"/>

    <!-- Bottom Feature Cards -->
    <rect x="25" y="185" width="135" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="35" y="197" width="20" height="20" rx="4" fill="#0284c7" opacity="0.3"/>
    <rect x="62" y="202" width="70" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="35" y="228" width="115" height="6" rx="2" fill="#64748b"/>
    <rect x="35" y="240" width="80" height="6" rx="2" fill="#475569"/>

    <rect x="175" y="185" width="135" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="185" y="197" width="20" height="20" rx="4" fill="#3b82f6" opacity="0.3"/>
    <rect x="212" y="202" width="70" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="185" y="228" width="115" height="6" rx="2" fill="#64748b"/>
    <rect x="185" y="240" width="90" height="6" rx="2" fill="#475569"/>

    <rect x="325" y="210" width="150" height="50" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <circle cx="345" cy="235" r="6" fill="#22c55e"/>
    <text x="360" y="238" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc">100% Responsive</text>
  </g>
</svg>
